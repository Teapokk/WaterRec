name: 🌊 WaterRec Premium CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🛡️ Grant Gradle Permissions
        run: chmod +x gradlew

      - name: 🚀 Compile & Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 📱 WaterRec-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 15

      - name: 📝 Print Build Summary
        run: |
          echo "# 🌊 WaterRec Build Status: SUCCESS ✅" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Workflow Details" >> $GITHUB_STEP_SUMMARY
          echo "- 🌿 **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🧑‍💻 **Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏱️ **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Output" >> $GITHUB_STEP_SUMMARY
          echo "The APK was successfully generated and is available for download in the Artifacts tab." >> $GITHUB_STEP_SUMMARY
          
